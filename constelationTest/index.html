<title>A Casa — Constelação</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  /* ── tokens: espaço quente, o fio-fantasma é a única fonte de luz ── */
  :root{
    --ground:#0C0B0A; --ground-2:#151110; --veil:#080706;
    --ink:#EEE7DE; --muted:#9C9188; --faint:#5D554E;
    --thread:#FBF4EA;                 /* núcleo pálido do fio (etéreo) */
    --ember:#FF5722;                  /* o brilho quente do manifesto */
    --tagged:#FF6A3D; --blimey:#2AA9E6; --prumo:#E6A93A; --meca:#3EC8B6;
    --line:rgba(238,231,222,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(120% 90% at 50% 42%, #191412 0%, var(--ground) 46%, var(--veil) 100%);
    color:var(--ink);
    font-family:"Helvetica Neue",system-ui,-apple-system,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  .stage{position:fixed; inset:0; overflow:hidden}
  canvas#stars{position:absolute; inset:0; width:100%; height:100%; opacity:.55}

  /* ── legenda superior: o que é este fio ── */
  .eyebrow{
    position:absolute; top:clamp(18px,4vh,40px); left:0; right:0;
    text-align:center; z-index:6; pointer-events:none; padding:0 20px;
  }
  .eyebrow .kicker{
    font-size:11px; letter-spacing:.42em; text-transform:uppercase;
    color:var(--muted); font-weight:700;
  }
  .eyebrow h1{
    margin:.5em auto 0; max-width:22ch; text-wrap:balance;
    font-weight:800; letter-spacing:-.02em; line-height:1.06;
    font-size:clamp(22px,3.4vw,40px);
  }
  .eyebrow h1 em{
    font-style:normal;
    background:linear-gradient(90deg,var(--thread),var(--ember) 70%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .eyebrow p{
    margin:.7em auto 0; max-width:46ch; color:var(--muted);
    font-size:clamp(12.5px,1.5vw,15px); line-height:1.5;
  }

  /* ── o fio-fantasma (svg cobre a cena) ── */
  svg.web{position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none}

  /* ── nós ── */
  .node{
    position:absolute; z-index:4; transform:translate(-50%,-50%);
    display:flex; flex-direction:column; align-items:center; gap:10px;
    background:none; border:0; cursor:pointer; color:inherit;
    font-family:inherit; padding:0; width:max-content;
  }
  .disc{
    --c:var(--ember);
    position:relative; width:var(--d,96px); height:var(--d,96px);
    border-radius:50%; display:grid; place-items:center;
    background:radial-gradient(60% 60% at 50% 38%, color-mix(in srgb,var(--c) 34%, #0c0b0a), #0c0b0a 78%);
    border:1.5px solid color-mix(in srgb,var(--c) 55%, transparent);
    box-shadow:
      0 0 0 6px color-mix(in srgb,var(--c) 8%, transparent),
      0 0 34px -6px color-mix(in srgb,var(--c) 65%, transparent),
      inset 0 0 22px -6px color-mix(in srgb,var(--c) 55%, transparent);
    transition:transform .5s cubic-bezier(.2,.8,.2,1), box-shadow .5s, border-color .5s;
  }
  .mono{
    font-weight:800; font-size:calc(var(--d,96px)*.4); line-height:1;
    letter-spacing:-.03em;
    color:color-mix(in srgb,var(--c) 78%, var(--ink));
    text-shadow:0 0 18px color-mix(in srgb,var(--c) 60%, transparent);
  }
  .halo{                     /* anel de prontidão em volta do disco */
    position:absolute; inset:-10px; border-radius:50%;
    border:1.5px solid color-mix(in srgb,var(--c) 40%, transparent);
    opacity:.5;
  }
  .node .label{display:flex; flex-direction:column; align-items:center; gap:3px}
  .node .name{font-weight:800; font-size:15px; letter-spacing:.01em}
  .node .dna{
    font-size:11.5px; color:var(--muted); max-width:19ch; text-align:center;
    line-height:1.35;
  }
  .node .state{
    margin-top:2px; font-size:9.5px; font-weight:800; letter-spacing:.18em;
    text-transform:uppercase; padding:3px 9px; border-radius:999px;
    border:1px solid color-mix(in srgb,var(--c) 40%,transparent);
    color:color-mix(in srgb,var(--c) 85%, var(--ink));
    background:color-mix(in srgb,var(--c) 12%, transparent);
  }

  /* estados de prontidão: quanto mais "fantasma", menos pronto */
  .node[data-ready="ready"]   .disc{--d:112px}
  .node[data-ready="soon"]    { opacity:.82 }
  .node[data-ready="far"]     { opacity:.6 }
  .node[data-ready="far"] .disc, .node[data-ready="soon"] .disc{ --d:88px }

  /* pulso de vida — mais forte no que está pronto */
  @keyframes breathe{50%{box-shadow:
    0 0 0 10px color-mix(in srgb,var(--c) 6%, transparent),
    0 0 60px -6px color-mix(in srgb,var(--c) 80%, transparent),
    inset 0 0 26px -6px color-mix(in srgb,var(--c) 60%, transparent)}}
  .node[data-ready="ready"] .disc{animation:breathe 3.6s ease-in-out infinite}
  .node[data-ready="soon"]  .disc{animation:breathe 5s   ease-in-out infinite}
  @keyframes drift{50%{transform:translateY(-9px)}}
  .node .inner{animation:drift 7s ease-in-out infinite}

  /* hover / foco: o nó floresce */
  .node:hover .disc, .node:focus-visible .disc{
    transform:scale(1.08);
    border-color:color-mix(in srgb,var(--c) 90%, transparent);
    box-shadow:
      0 0 0 12px color-mix(in srgb,var(--c) 9%, transparent),
      0 0 80px -4px color-mix(in srgb,var(--c) 90%, transparent),
      inset 0 0 30px -4px color-mix(in srgb,var(--c) 70%, transparent);
  }
  .node:focus-visible{outline:none}
  .node:hover .halo{opacity:1; inset:-16px; transition:inset .5s, opacity .5s}

  /* núcleo: o manifesto */
  .core{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    z-index:3; text-align:center; width:min(260px,42vw); pointer-events:none;
  }
  .core .orb{
    width:132px; height:132px; margin:0 auto 14px; border-radius:50%;
    background:radial-gradient(52% 52% at 50% 42%, #fff 0%, var(--ember) 34%, #3a1206 74%, transparent 100%);
    box-shadow:0 0 70px -6px color-mix(in srgb,var(--ember) 70%,transparent),
               0 0 140px -10px color-mix(in srgb,var(--ember) 45%,transparent);
    display:grid; place-items:center; position:relative;
    animation:breathe 4.4s ease-in-out infinite; --c:var(--ember);
  }
  .core .orb b{
    font-family:"Iowan Old Style",Palatino,"Palatino Linotype",Georgia,serif;
    font-style:italic; font-weight:600; font-size:20px; color:#1a0d07;
    text-shadow:0 1px 0 rgba(255,255,255,.4); letter-spacing:.01em;
  }
  .core .cap{font-size:10.5px; letter-spacing:.34em; text-transform:uppercase; color:var(--muted); font-weight:700}
  .core .phrase{
    font-family:"Iowan Old Style",Palatino,Georgia,serif; font-style:italic;
    color:var(--ink); font-size:14.5px; margin-top:6px; line-height:1.4; opacity:.92;
  }

  /* painel de detalhe da porta */
  .scrim{position:absolute; inset:0; z-index:8; background:rgba(6,5,4,.62);
    backdrop-filter:blur(6px); opacity:0; visibility:hidden; transition:opacity .45s, visibility .45s}
  .scrim.on{opacity:1; visibility:visible}
  .panel{
    position:absolute; z-index:9; left:50%; top:50%;
    transform:translate(-50%,-46%) scale(.96); opacity:0; visibility:hidden;
    width:min(560px,92vw);
    background:linear-gradient(180deg,var(--ground-2),#0d0b0a);
    border:1px solid color-mix(in srgb,var(--pc,var(--ember)) 30%, var(--line));
    border-radius:22px; padding:30px clamp(22px,4vw,38px) 26px;
    box-shadow:0 40px 120px -30px #000, 0 0 90px -30px color-mix(in srgb,var(--pc) 60%,transparent);
    transition:opacity .45s cubic-bezier(.2,.8,.2,1), transform .45s cubic-bezier(.2,.8,.2,1), visibility .45s;
  }
  .panel.on{opacity:1; visibility:visible; transform:translate(-50%,-50%) scale(1)}
  .panel .back{
    display:inline-flex; align-items:center; gap:7px; background:none; border:0;
    color:var(--muted); font:inherit; font-size:12.5px; font-weight:700; cursor:pointer;
    padding:6px 10px; margin:-6px 0 16px -10px; border-radius:9px; letter-spacing:.02em;
  }
  .panel .back:hover{color:var(--ink); background:var(--line)}
  .panel .top{display:flex; align-items:center; gap:16px; margin-bottom:16px}
  .panel .pdisc{
    width:60px; height:60px; border-radius:50%; flex:none; display:grid; place-items:center;
    background:radial-gradient(60% 60% at 50% 38%, color-mix(in srgb,var(--pc) 34%,#0c0b0a), #0c0b0a 78%);
    border:1.5px solid color-mix(in srgb,var(--pc) 60%,transparent);
    box-shadow:0 0 30px -8px color-mix(in srgb,var(--pc) 80%,transparent);
  }
  .panel .pdisc .mono{font-size:26px}
  .panel h2{margin:0; font-size:clamp(22px,4.4vw,30px); font-weight:800; letter-spacing:-.02em}
  .panel .pstate{font-size:10px; font-weight:800; letter-spacing:.2em; text-transform:uppercase;
    color:color-mix(in srgb,var(--pc) 85%,var(--ink))}
  .panel .lead{color:var(--ink); font-size:15px; line-height:1.6; margin:0 0 16px}
  .panel .lead em{font-style:normal; color:color-mix(in srgb,var(--pc) 85%,var(--ink)); font-weight:700}
  .panel ul{list-style:none; margin:0 0 22px; padding:0; display:grid; gap:9px}
  .panel li{display:flex; gap:11px; align-items:flex-start; font-size:13.5px; color:var(--muted); line-height:1.45}
  .panel li .dot{width:7px; height:7px; border-radius:50%; margin-top:6px; flex:none;
    background:var(--pc); box-shadow:0 0 10px color-mix(in srgb,var(--pc) 80%,transparent)}
  .panel .cta{
    display:inline-flex; align-items:center; gap:8px; font:inherit; font-weight:800; font-size:14px;
    padding:13px 20px; border-radius:13px; border:0; cursor:pointer; letter-spacing:.01em;
    color:#0c0b0a; background:linear-gradient(90deg,var(--pc),color-mix(in srgb,var(--pc) 70%,#fff));
    box-shadow:0 10px 30px -10px color-mix(in srgb,var(--pc) 70%,transparent);
  }
  .panel .cta.ghost{background:none; color:color-mix(in srgb,var(--pc) 85%,var(--ink));
    border:1.5px solid color-mix(in srgb,var(--pc) 45%,transparent); box-shadow:none}

  .footnote{position:absolute; bottom:clamp(14px,3vh,26px); left:0; right:0; text-align:center;
    z-index:6; color:var(--faint); font-size:11px; letter-spacing:.12em; text-transform:uppercase; pointer-events:none}

  @media (max-width:720px){
    .node .label{display:none}
    .core{width:60vw}
    .node[data-ready="ready"] .disc{--d:84px}
    .disc{--d:70px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important; transition:none !important}
  }
</style>

<div class="stage" id="stage">
  <canvas id="stars"></canvas>

  <svg class="web" id="web" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <!-- o fantasma: ruído animado distorce o traço -> ondula vivo -->
      <filter id="ghost" x="-30%" y="-30%" width="160%" height="160%">
        <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.006 0.011"
                      numOctaves="2" seed="7" result="n">
          <animate attributeName="baseFrequency" dur="18s" repeatCount="indefinite"
                   values="0.006 0.011; 0.010 0.007; 0.006 0.011"/>
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="34"
                           xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <linearGradient id="threadgrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0"  stop-color="#FBF4EA"/>
        <stop offset=".5" stop-color="#FF7A45"/>
        <stop offset="1"  stop-color="#FBF4EA"/>
      </linearGradient>
      <filter id="soft"><feGaussianBlur stdDeviation="3.2"/></filter>
    </defs>
    <!-- raios tênues do núcleo pra cada porta -->
    <g id="spokes" stroke="var(--line)" stroke-width="1"></g>
    <!-- o fio contínuo (glow + core), ambos sob o filtro fantasma -->
    <g filter="url(#ghost)">
      <path id="threadGlow" fill="none" stroke="url(#threadgrad)" stroke-width="7"
            stroke-linecap="round" opacity=".28" filter="url(#soft)"/>
      <path id="thread" fill="none" stroke="url(#threadgrad)" stroke-width="2.2"
            stroke-linecap="round"/>
    </g>
  </svg>

  <div class="eyebrow">
    <div class="kicker">Uma casa · quatro portas · um só fio</div>
    <h1>O fio que <em>persegue a mudança</em></h1>
    <p>Do mesmo manifesto saem quatro empresas. Cada uma devolve poder a quem o sistema
       deixa de fora — e o mesmo fio, vivo, liga todas.</p>
  </div>

  <div class="core">
    <div class="orb" style="--c:var(--ember)"><b>liber&nbsp;sum</b></div>
    <div class="cap">O Manifesto</div>
    <div class="phrase">Penso, testemunho, ajo — logo sou livre.</div>
  </div>

  <!-- nós inseridos via JS -->

  <div class="footnote">passe o mouse · toque numa porta</div>

  <div class="scrim" id="scrim"></div>
  <div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="pTitle"></div>
</div>

<script>
(function(){
  var reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;

  // ── as quatro portas ───────────────────────────────────────────
  var NODES = [
    { key:"tagged", name:"Tagged", mono:"◎", c:"var(--tagged)", ready:"ready",
      x:24, y:31, dna:"sua voz vira ação", state:"Pronto",
      lead:"A praça. Onde a indignação vira <em>ação com peso</em>: denúncia que é petição, cada like uma assinatura.",
      pts:["Portal da Transparência: o político na palma da mão do eleitor",
           "Denúncia → assinatura → resolução → celebração",
           "Jornalismo P2P, de gente pra gente"],
      cta:"Baixar agora", ghost:false },
    { key:"blimey", name:"blimey", mono:"b", c:"var(--blimey)", ready:"soon",
      x:76, y:29, dna:"seu bairro alimenta seu bairro", state:"A caminho",
      lead:"O balcão. Poder de compra coletivo que <em>baratea a comida</em> — espaço ocioso vira mercado do bairro.",
      pts:["ghostMarkets: uma garagem parada vira ponto de venda",
           "Preço da indústria, sem a gordura do caminho",
           "Renda e entrega dentro da própria microrregião"],
      cta:"O que vem", ghost:true },
    { key:"prumo", name:"PRUMO", mono:"P", c:"var(--prumo)", ready:"soon",
      x:78, y:71, dna:"gestão pra quem levanta o país", state:"Em construção",
      lead:"O canteiro. Gestão de empreitadas e times de obra — e um <em>discovery</em> de quem faz e do que se usa.",
      pts:["ghostCrew: pedreiro, eletricista e engenheiro achados por especialidade",
           "ghostBuild: material vendido direto no app",
           "Uma reputação que acumula em toda a casa"],
      cta:"O que vem", ghost:true },
    { key:"meca", name:"Meca", mono:"M", c:"var(--meca)", ready:"far",
      x:22, y:71, dna:"o diagnóstico na mão de quem conserta", state:"Em breve",
      lead:"A oficina. A IA monta a checklist, o mecânico marca as divergências, e volta o <em>plano + orçamento</em> pronto.",
      pts:["Sintoma → checklist → divergências em amarelo → laudo da IA",
           "Caça a peça no melhor preço e monta o orçamento sozinha",
           "ghostParts: sua peça anunciada direto no app"],
      cta:"O que vem", ghost:true }
  ];

  var stage = document.getElementById("stage");
  var web   = document.getElementById("web");
  var spokes= document.getElementById("spokes");
  var thread= document.getElementById("thread");
  var glow  = document.getElementById("threadGlow");

  // cria os nós
  NODES.forEach(function(n){
    var b=document.createElement("button");
    b.className="node"; b.dataset.ready=n.ready; b.dataset.key=n.key;
    b.style.left=n.x+"%"; b.style.top=n.y+"%";
    b.setAttribute("aria-label",n.name+" — "+n.state);
    b.innerHTML=
      '<span class="inner" style="--c:'+n.c+'"><span class="disc"><span class="halo"></span>'+
        '<span class="mono">'+n.mono+'</span></span></span>'+
      '<span class="label"><span class="name">'+n.name+'</span>'+
        '<span class="dna">'+n.dna+'</span>'+
        '<span class="state" style="--c:'+n.c+'">'+n.state+'</span></span>';
    b.addEventListener("click",function(){ openPanel(n); });
    stage.appendChild(b);
  });

  // ── geometria do fio (segue o tamanho da tela) ──────────────────
  function pt(n){ return { x:web.clientWidth*n.x/100, y:web.clientHeight*n.y/100 }; }
  function center(){ return { x:web.clientWidth/2, y:web.clientHeight/2 }; }

  // caminho suave (catmull-rom -> bezier) passando pelo núcleo e portas
  function smooth(points){
    if(points.length<2) return "";
    var d="M"+points[0].x+" "+points[0].y;
    for(var i=0;i<points.length-1;i++){
      var p0=points[i-1]||points[i], p1=points[i], p2=points[i+1], p3=points[i+2]||p2;
      var c1x=p1.x+(p2.x-p0.x)/6, c1y=p1.y+(p2.y-p0.y)/6;
      var c2x=p2.x-(p3.x-p1.x)/6, c2y=p2.y-(p3.y-p1.y)/6;
      d+="C"+c1x+" "+c1y+" "+c2x+" "+c2y+" "+p2.x+" "+p2.y;
    }
    return d;
  }

  function layout(){
    var c=center();
    // o fio tece: Tagged → núcleo → blimey → PRUMO → núcleo → Meca → Tagged
    var order=[NODES[0],null,NODES[1],NODES[2],null,NODES[3],NODES[0]];
    var pts=order.map(function(o){ return o?pt(o):c; });
    var d=smooth(pts);
    thread.setAttribute("d",d); glow.setAttribute("d",d);
    // raios do núcleo
    spokes.innerHTML="";
    NODES.forEach(function(n){
      var p=pt(n);
      var l=document.createElementNS("http://www.w3.org/2000/svg","line");
      l.setAttribute("x1",c.x); l.setAttribute("y1",c.y);
      l.setAttribute("x2",p.x); l.setAttribute("y2",p.y);
      spokes.appendChild(l);
    });
    // fluxo de energia ao longo do fio
    var len=thread.getTotalLength();
    thread.style.strokeDasharray=(len*0.12)+" "+(len*0.88);
    if(!reduce){ flow(len); }
  }
  var flowRAF;
  function flow(len){
    cancelAnimationFrame(flowRAF);
    var t0=performance.now();
    (function step(t){
      var off = ((t-t0)/9000)%1;             // volta completa a cada 9s
      thread.style.strokeDashoffset = -off*len;
      flowRAF=requestAnimationFrame(step);
    })(t0);
  }

  // ── campo de estrelas (atmosfera, discreto) ─────────────────────
  var cv=document.getElementById("stars"), cx=cv.getContext("2d"), stars=[];
  function sizeStars(){
    var r=devicePixelRatio||1;
    cv.width=innerWidth*r; cv.height=innerHeight*r; cx.setTransform(r,0,0,r,0,0);
    var n=Math.min(120, Math.round(innerWidth*innerHeight/14000)); stars=[];
    for(var i=0;i<n;i++) stars.push({
      x:Math.random()*innerWidth, y:Math.random()*innerHeight,
      z:Math.random()*.8+.2, tw:Math.random()*Math.PI*2
    });
  }
  function drawStars(t){
    cx.clearRect(0,0,innerWidth,innerHeight);
    for(var i=0;i<stars.length;i++){ var s=stars[i];
      var a=(reduce?.5:(0.35+0.35*Math.sin(t/900+s.tw)))*s.z;
      cx.beginPath(); cx.arc(s.x,s.y,s.z*1.3,0,7);
      cx.fillStyle="rgba(251,244,234,"+a.toFixed(3)+")"; cx.fill();
      if(!reduce){ s.y+=s.z*0.06; if(s.y>innerHeight) s.y=0; }
    }
    if(!reduce) requestAnimationFrame(drawStars);
  }

  // ── painel ──────────────────────────────────────────────────────
  var scrim=document.getElementById("scrim"), panel=document.getElementById("panel"), lastFocus=null;
  function openPanel(n){
    lastFocus=document.activeElement;
    panel.style.setProperty("--pc",n.c);
    panel.innerHTML=
      '<button class="back" id="backBtn">&larr; voltar à constelação</button>'+
      '<div class="top"><div class="pdisc"><span class="mono" style="--c:'+n.c+'">'+n.mono+'</span></div>'+
        '<div><div class="pstate">'+n.state+'</div><h2 id="pTitle">'+n.name+'</h2></div></div>'+
      '<p class="lead">'+n.lead+'</p>'+
      '<ul>'+n.pts.map(function(p){return '<li><span class="dot"></span><span>'+p+'</span></li>';}).join("")+'</ul>'+
      '<button class="cta'+(n.ghost?' ghost':'')+'">'+n.cta+
        (n.ghost?' &rarr;':' &darr;')+'</button>';
    scrim.classList.add("on"); panel.classList.add("on");
    document.getElementById("backBtn").addEventListener("click",closePanel);
    document.getElementById("backBtn").focus();
  }
  function closePanel(){
    scrim.classList.remove("on"); panel.classList.remove("on");
    if(lastFocus) lastFocus.focus();
  }
  scrim.addEventListener("click",closePanel);
  document.addEventListener("keydown",function(e){ if(e.key==="Escape") closePanel(); });

  // parallax suave do fio conforme o mouse (vida extra, não obrigatório)
  if(!reduce){
    stage.addEventListener("pointermove",function(e){
      var dx=(e.clientX/innerWidth-.5), dy=(e.clientY/innerHeight-.5);
      web.style.transform="translate("+(dx*14)+"px,"+(dy*14)+"px)";
    });
  }

  function boot(){ sizeStars(); layout(); if(!reduce) requestAnimationFrame(drawStars); else drawStars(0); }
  addEventListener("resize",function(){ sizeStars(); layout(); });
  boot();
})();
</script>
